[project]
name = "rag-ingestion-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["rag-api", "celery[redis]>=5.4,<6"]

[tool.uv.sources]
rag-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_worker"]
