name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: |
          uv sync --all-packages --frozen
          pnpm install --frozen-lockfile
          uv pip check
      - name: Lint, types, unit tests and contracts
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest tests/unit tests/contract
          pnpm contracts:check
      - name: Build workspace packages
        run: uv build --all-packages
      - name: Start local infrastructure
        run: docker compose -f infra/compose.yaml up -d --build --wait
      - name: Validate migrations and service integration
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python scripts/init_storage.py
          uv run pytest tests/integration
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
          uv run python scripts/smoke_processes.py
      - name: Confirm generated artifacts and tracked file hygiene
        run: |
          git diff --exit-code
          test -z "$(git ls-files '.env' '.env.local' '*.pem' '*.key' 'data/*' 'graphify-out/*')"
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/compose.yaml down --volumes
